  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <h1 class="title">Swiss / International Style — Examples</h1>
      <nav aria-label="Main navigation" class="main-nav">
        <a href="index.html">Home</a>
        <a href="history.html">History</a>
        <a href="examples.html">Examples</a>
        <a href="demo.html">Demo</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section>
      <p>The gallery below features 6 examples of the International Typographic Style, demonstrating the use of grid systems, sans-serif typography, and objective communication.</p>

      <div class="swiss-gallery">
        
        <figure class="swiss-figure">
          <img src="images/image1.jpg" alt="Poster design using a strong grid and Helvetica typography." class="photo" />
          <figcaption><strong>This is an example of Bauhaus-inspired geometric abstraction, a contemporary pattern heavily influenced by early 20th-century modernist art and design</figcaption>
        </figure>

        <figure class="swiss-figure">
          <img src="images/image2.jpg" alt="A second poster example showing asymmetric composition." class="photo" />
          <figcaption><strong>This image is a vibrant example of a contemporary pattern that synthesizes elements from two major 20th-century design movements: Bauhaus and Memphis Design</figcaption>
        </figure>

        <figure class="swiss-figure">
          <img src="images/image3.jpg" alt="Example of pure typographic hierarchy in Swiss style." class="photo" />
          <figcaption><strong>This design can be categorized primarily by the Flat Design aesthetic, but it also strongly reflects the influence of the Swiss Design Lineage</figcaption>
        </figure>

        <figure class="swiss-figure">
          <img src="images/image4.png" alt="A fourth example of Swiss Style graphic design." class="photo" />
          <figcaption><strong>This is a contemporary digital creation inspired by the historical Swiss Style and Kandinsky's abstract work</figcaption>
        </figure>

        <figure class="swiss-figure">
          <img src="images/image5.jpeg" alt="A fifth example of Swiss Style graphic design." class="photo" />
          <figcaption><strong>This design is a direct descendant of the principles established by pioneers of this movement like Ernst Keller, Josef Müller-Brockmann, and Armin Hofmann</figcaption>
        </figure>

        <figure class="swiss-figure">
          <img src="images/image6.jpg" alt="A sixth example of Swiss Style graphic design." class="photo" />
          <figcaption><strong>This image is a direct and modern example of the Swiss Design Lineage</figcaption>
        </figure>

      </div>

    </section>
  </main>

  <footer class="site-footer">
    <p>Project created by: Serge Lawson.</p>
  </footer>
</body>
</html>
